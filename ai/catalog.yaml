# 农业 AI 模型与技能目录
#
# 用途：每日从 Hugging Face 与 GitHub 采集农业相关大模型、模型项目、
#       Agent Skill、数据集与 MCP 服务，汇总为本仓库文档。
#       本文件是机器可读的目录源，条目为人工筛选与整理的结果；
#       下载量 / Star 数等实时指标不写入本文件，由采集脚本写入
#       ai/stats.json，并渲染进 ai/INDEX.md 的「实时数据快照」一节。
#
# 采集与更新方法见 ai/README.md；阅读版文档见 ai/INDEX.md。
#
# 字段说明：
#   id           稳定标识，格式 <kind>:<名称 slug>，发布后不改
#   name         展示名（模型 ID / 仓库名 / 项目名）
#   kind         hf-model     Hugging Face 模型
#                gh-repo      GitHub 模型 / 框架 / 基准项目
#                skill        Agent Skill（Claude Code / AgentSkills 等）
#                dataset      Hugging Face 数据集
#                mcp          MCP 服务器
#                paper-list   论文 / 资源列表
#   url          主链接（模型页 / 仓库 / 数据集页）
#   alt_url      可选，镜像、ModelScope 或论文链接
#   langs        主要语言：zh / en / ja / multilingual / ...
#   domain       农业子领域：综合 / 作物 / 植保 / 畜牧兽医 / 农业资源 /
#                农业经济 / 智慧农业 / 农史农文 / 食品营养 / 遥感地理
#   base         基座模型（如适用）
#   org          研发机构 / 作者
#   since        项目首次公开年份（约）
#   note         一句话说明（中文，客观描述，不含营销语）

meta:
  title: 农业 AI 模型与技能目录
  snapshot_date: "2026-11-09"
  refresh: 每日一次，由 scripts/fetch_ai_catalog.py 采集
  hf_endpoints:
    - https://huggingface.co/api
    - https://hf-mirror.com/api   # huggingface.co 不可达时的镜像

