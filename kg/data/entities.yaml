# 古籍知识图谱的主题实体。
#
# 字段：
#   id          稳定标识，格式为 类型前缀:拼音
#   type        必须是 kg/schema.yaml 中定义的实体类型
#   name        规范名称
#   aliases     正文中可能出现的异名、简称、异体字；构建时做最长匹配
#   description 一句话说明
#   index       是否参与自动提及抽取，默认 true；过于宽泛的实体可设为 false
#
# 别名冲突会导致构建失败，新增时请先运行 python3 kg/build.py --scan。

entities:
  # ------------------------------------------------------------------
  # 概念：用于建立分类层次的抽象类目
  # ------------------------------------------------------------------
  - {id: "concept:agricultural-tool", type: Concept, name: "農具", aliases: ["農具", "農器"], description: "農業生產工具總稱。"}
  - {id: "concept:water-facility", type: Concept, name: "水利設施", aliases: ["水利設施", "水利工程"], description: "堤、閘、堰、塘等水利工程設施總稱。"}
  - {id: "concept:crop", type: Concept, name: "作物", aliases: ["作物", "農作物"], description: "人工栽培的植物總稱。"}
  - {id: "concept:grain", type: Concept, name: "穀物", aliases: ["穀物", "五穀", "糧食"], description: "糧食作物總稱。"}
  - {id: "concept:fiber-crop", type: Concept, name: "纖維作物", aliases: ["纖維作物", "衣料作物"], description: "提供纖維、用於紡織的作物。"}
  - {id: "concept:farming-technique", type: Concept, name: "耕作技術", aliases: ["耕作技術", "農作技術"], description: "耕作、栽培與田間管理技術總稱。"}
  - {id: "concept:river-engineering", type: Concept, name: "治河方略", aliases: ["治河方略", "治河"], description: "治理黃河等河流的方略與工程傳統。"}
  - {id: "concept:water-lifting-machine", type: Concept, name: "提水機械", aliases: ["提水機械", "提水器具"], description: "水車等提水機械總稱。"}
  - {id: "concept:waterway", type: Concept, name: "水道", aliases: ["水道", "水系"], description: "河流、湖泊、運河等水系總稱。"}
  - {id: "concept:relief-system", type: Concept, name: "荒政制度", aliases: ["荒政制度", "救荒制度"], description: "備荒、賑濟與災後救濟制度總稱。"}
  - {id: "concept:water-technique", type: Concept, name: "水利技術", aliases: ["水利技術", "水利之學"], description: "灌溉、防洪、治河與海塘工程技術總稱。", index: false}

  # ------------------------------------------------------------------
  # 制度
  # ------------------------------------------------------------------
