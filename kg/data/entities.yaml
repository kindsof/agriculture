  - {id: "tech:famine-relief", type: Technique, name: "救荒", aliases: ["救荒", "賑濟", "賑災"], description: "災荒救濟的具體措施。"}
  - {id: "tech:locust-control", type: Technique, name: "捕蝗", aliases: ["捕蝗", "除蝗", "治蝗"], description: "防治蝗災的技術與制度。"}
