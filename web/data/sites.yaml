# 中华农耕文化地图 —— 站点数据
#
# 字段说明：
#   id        唯一标识（小写字母、数字、连字符）
#   name      站点名称
#   category  类别，取值见 web/assets/app.js 中的 CATEGORIES
#   province  省级行政区（与 provinces.geojson 的 properties.name 一致）
#   city      市/县/乡镇
#   lng/lat   示意坐标（WGS-84，取县域或乡镇中心，精确到小数点后两位）
