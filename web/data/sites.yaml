  - id: qingyuan-mushroom
    name: 庆元林-菇共育系统
    category: specialty
    province: 浙江省
    city: 丽水市庆元县
    lng: 119.06
    lat: 27.62
    summary: >-
      丽水庆元的林-菇共育系统，菇农在阔叶林中以原木栽培香菇，利用林木遮阴和湿度形成“林—菇—人”共生，是香菇人工栽培的重要发源地之一。
