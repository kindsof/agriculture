    lat: 38.85
    summary: >-
      天津津南小站一带的稻作系统，清末淮军屯垦引入水稻，依托海河、马厂减河等水系，形成“小站稻”品牌，是北方粳稻的代表。
    culture: >-
      小站稻的育秧、插秧、收割习俗与屯垦历史、运河文化交织；当地以稻米节、农事体验展示津沽稻作传统。
