# 数据以农业农村部中国重要农业文化遗产名录、全球重要农业文化遗产名录、
# 中国非物质文化遗产网、世界灌溉工程遗产名录等公开资料为依据整理；
# 介绍文字为编者综述，不代替原始资料。

