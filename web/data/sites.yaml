sites:
  - id: jingxi-rice
    name: 京西稻作文化系统
    category: rice
    province: 北京市
    city: 海淀区上庄镇
    lng: 116.21
    lat: 40.10
    summary: >-
      北京西郊海淀上庄一带的稻作系统，依托玉泉山、万泉河等泉水灌溉，稻田与皇家苑囿、城市聚落交织，是北方城市近郊稻作文化的代表。
    culture: >-
      京西稻米历史上曾为宫廷用米，插秧、收割与泉水灌溉习俗相连；今天通过稻田观光、农事体验延续城市中的稻作记忆。
    heritage:
      - 中国重要农业文化遗产（2015）
    tags: [京西稻, 城市农业, 泉水灌溉, 海淀]
    sources:
      - title: 中国重要农业文化遗产名录（188项）
        url: https://nync.huzhou.gov.cn/ztzl/hzsnywhyczy/zgzynywhycml/art/2025/art_1716485168.html

